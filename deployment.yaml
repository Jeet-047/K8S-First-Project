apiVersion: apps/v1
kind: Deployment
metadata:
  name: kubernetes-first-app
spec:
  replicas: 2 # Number of pods
  selector:
    matchLabels:
      app: kubernetes-first-app
  template:
    metadata:
      labels:
        app: kubernetes-first-app
    spec:
      containers:
      - name: kubernetes-first-app
        image: kubernetes-first-app:latest
        imagePullPolicy: Never # Tell Kubernetes not to pull from a registry
        # image: jeet047/kubernetes-first-app:latest # Docker Hub image if not using local image
        resources:
          limits:
            memory: "64Mi"
            cpu: "200m"
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: kubernetes-first-app
spec:
  selector:
    app: kubernetes-first-app
  ports:
  - port: 8000
    targetPort: 5000